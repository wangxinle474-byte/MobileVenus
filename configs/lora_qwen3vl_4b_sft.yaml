### model
model_name_or_path: /root/autodl-tmp/models/Qwen3-VL-4B-Instruct
image_max_pixels: 262144
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: ArtEdit_LoRA_train
eval_dataset: ArtEdit_LoRA_val
template: qwen3_vl_nothink
cutoff_len: 12288
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 32
dataloader_num_workers: 8

### output
output_dir: /root/autodl-tmp/checkpoints/intelligence_camera/lora_v1
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train (\u5355\u5361 RTX 5090 / 32GB, LoRA)
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
max_grad_norm: 1.0
gradient_checkpointing: true

### eval
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
